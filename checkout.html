<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkout | My London Transfer</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<header class="site-header"><div class="nav-shell">
  <a class="brand" href="index.html" aria-label="My London Transfer home"><img class="brand-logo" src="assets/images/mlt/logo.png" alt="My London Transfer"></a>
  <a class="signin" href="account.html">Sign In</a>
  <button class="menu-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
  <nav class="mobile-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="booking.html">Book</a><a href="account.html">Account</a></nav>
</div></header>
<main>
  <section class="booking-section standalone-booking">
    <div class="booking-card">
      <div class="booking-heading">
        <div>
          <span class="section-kicker">SECURE PAYMENT</span>
          <h2>Confirm your <em>transfer</em></h2>
        </div>
        <span class="secure"><i class="bi bi-shield-check"></i> Card details stay with Stripe</span>
      </div>
      <div id="trip-summary" class="trip-summary">Loading your quote…</div>
      <form id="checkout-form" class="booking-form checkout-form" hidden>
        <div class="field"><label for="name">Full name</label><div><i class="bi bi-person"></i><input id="name" name="name" required autocomplete="name"></div></div>
        <div class="field"><label for="email">Email</label><div><i class="bi bi-envelope"></i><input id="email" name="email" type="email" required autocomplete="email"></div></div>
        <div class="field"><label for="phone">Phone</label><div><i class="bi bi-telephone"></i><input id="phone" name="phone" type="tel" required autocomplete="tel"></div></div>
        <div class="field"><label for="flight">Flight number (optional)</label><div><i class="bi bi-airplane"></i><input id="flight" name="flight" autocomplete="off"></div></div>
        <div class="field"><label for="notes">Notes (optional)</label><div><i class="bi bi-chat-left-text"></i><input id="notes" name="notes" autocomplete="off"></div></div>
        <button class="search-button" type="submit">Pay securely <i class="bi bi-lock"></i></button>
        <p class="form-message" id="checkout-message" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>
<script src="assets/js/script.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/checkout.js"></script>
</body>
</html>
